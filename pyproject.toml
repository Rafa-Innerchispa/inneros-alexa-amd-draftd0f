[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-alexa-amd-demo"
version = "0.1.0"
description = "InnerOS Alexa Voice to AMD Radeon AI PRO R9700 Low-Latency Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
